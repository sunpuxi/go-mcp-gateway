services:
  # =======================================================
  #  MySQL 8.0
  # =======================================================
  mysql:
    image: mysql:8.0
    container_name: mcp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@123456}
      MYSQL_DATABASE: mcp_gateway
    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/sql/init_table.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =======================================================
  #  Go 后端
  # =======================================================
  backend:
    build: .
    container_name: mcp-backend
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8081"
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-Root@123456}@tcp(mysql:3306)/mcp_gateway?charset=utf8mb4&parseTime=True
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin_change_me}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8081"

  # =======================================================
  #  React 前端 + Nginx
  # =======================================================
  frontend:
    build: ./web
    container_name: mcp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:
